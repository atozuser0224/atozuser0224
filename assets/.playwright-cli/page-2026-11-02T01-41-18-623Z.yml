- article [ref=f1e2]:
  - img "Arc — I'm building Lambda, a Windows assistant that uses your apps for you in a desktop of its own." [ref=f1e5]
  - paragraph [ref=f1e6]:
    - text: Hi, I'm Arc. Most of my time right now goes into
    - strong [ref=f1e7]: Lambda
    - text: ", an assistant for Windows."
  - paragraph [ref=f1e8]: "The idea is simple: you ask for something in plain words, and Lambda opens the apps, clicks through them and comes back with the result. The part I care about most is that it never borrows your mouse or keyboard. It works inside a separate Windows session that you don't have to watch, and when it needs something only you can give — a login, a 2FA code, a yes — it asks with a small form instead of taking over your screen."
  - heading "What it does today" [level=3] [ref=f1e9]
  - list [ref=f1e10]:
    - listitem [ref=f1e11]:
      - strong [ref=f1e12]: Works in its own desktop.
      - text: Apps Lambda opens run in a Windows child session, so your windows keep their focus and nothing flashes up while you work.
    - listitem [ref=f1e13]:
      - strong [ref=f1e14]: Reads your windows without touching them.
      - text: For apps you already have open, it uses accessibility patterns (invoke, value, selection) rather than simulated clicks.
    - listitem [ref=f1e15]:
      - strong [ref=f1e16]: Asks before it acts.
      - text: Sending mail, deleting things or paying goes through an approval card — on the PC, or signed on your phone.
    - listitem [ref=f1e17]:
      - strong [ref=f1e18]: Rooms with more than one helper.
      - text: You can add assistants with their own roles to a team chat; they answer when they're named and stay quiet otherwise.
    - listitem [ref=f1e19]:
      - strong [ref=f1e20]: Talk to it.
      - text: "There's a call mode: speak, it answers out loud, and you can cut in."
    - listitem [ref=f1e21]:
      - strong [ref=f1e22]: Point at things.
      - text: Freeze the screen, circle what you mean, and ask about it.
  - paragraph [ref=f1e23]:
    - 'img "A Lambda team room: the user, Lambda and two assistant bots talking in one timeline" [ref=f1e26]'
    - 'img "Lambda''s dashboard: schedule, mail, tasks and phone status laid out on one screen" [ref=f1e29]'
  - paragraph [ref=f1e30]: "It's early. Builds are unsigned development releases, there's a lot I'm still rebuilding, and I ship small updates often. If you're on Windows 11 and want to try it:"
  - paragraph [ref=f1e31]:
    - strong [ref=f1e32]:
      - link "Download the latest Lambda installer →" [ref=f1e33] [cursor=pointer]:
        - /url: https://github.com/atozuser0224/lambda-installer/releases/latest
  - paragraph [ref=f1e34]: There's an Android companion app too, for chatting with your PC and answering approvals away from your desk.
